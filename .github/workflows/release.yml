# Builds the APK and publishes a GitHub release for it. Run it by hand from the Actions tab
# (Release › Run workflow); it never runs by itself.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.0.0 (tagged v1.0.0; notes from docs/releases/v1.0.0.md)
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build the APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          apk="exo-player-v$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "v$VERSION" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Exo Player v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
